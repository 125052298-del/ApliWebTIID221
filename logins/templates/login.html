<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-4">
    <div class="w-full max-w-md rounded-xl bg-base-100 p-8 shadow-lg">
        <h1 class="mb-6 text-center text-2xl font-bold">INICIAR SESIÓN</h1>

        {% if error %}
            <p class="alert alert-error mb-4">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
            <label class="mb-1 block font-medium">Correo:</label>
            <input class="input input-bordered w-full" type="email" name="correo" required>
            <br><br>
            <label class="mb-1 block font-medium">Contraseña:</label>
            <input class="input input-bordered w-full" type="password" name="password" required>
            <br><br>
            <button class="btn btn-primary w-full" type="submit">Entrar</button>
        </form>
        <p class="mt-5 text-center text-sm">¿No tienes cuenta?</p>
        <a class="link link-primary mt-1 block text-center" href="{{ url_for('registro') }}">Registrate</a>
    </div>
</body>
</html>
