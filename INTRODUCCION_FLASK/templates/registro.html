<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <title>Registro</title>
</head>

<body>
    <div style="margin: 50px; max-width: 500px;">
        <h1>REGISTRAR USUARIO</h1>
        <br>

        <form method="POST" action="{{ url_for('registro') }}">
            <label for="nombre">Nombre:</label>
            <br>
            <input type="text" id="nombre" name="nombre" class="input input-accent" required>
            <br><br>

            <label for="apellido_p">Apellido Paterno:</label>
            <br>
            <input type="text" id="apellido_p" name="apellido_p" class="input input-accent" required>
            <br><br>

            <label for="apellido_m">Apellido Materno:</label>
            <br>
            <input type="text" id="apellido_m" name="apellido_m" class="input input-accent" required>
            <br><br>

            <label for="correo">Correo:</label>
            <br>
            <input type="email" id="correo" name="correo" class="input input-accent" required>
            <br><br>

            <label for="password">Contraseña:</label>
            <br>
            <input type="password" id="password" name="password" class="input input-accent" required>
            <br><br>

            <label for="id_rol">Rol:</label>
            <br>
            <select id="id_rol" name="id_rol" class="select select-accent" required>
                <option value="">Selecciona un rol</option>
                <option value="1">Administrador</option>
                <option value="2">Usuario</option>
            </select>
            <br><br>

            <button type="submit" class="btn btn-warning">Registrar</button>
            <a href="{{ url_for('home') }}" class="btn btn-ghost">Iniciar sesión</a>
        </form>
        
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</html>
