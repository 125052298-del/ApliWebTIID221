<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <title>Iniciar sesión</title>
</head>

<body>
    <div style="margin: 50px;">
        <h1>
            INICIAR SESIÓN
        </h1>
        <br>
        <form method="POST" action="{{ url_for('iniciar_sesion') }}">
            <label for="correo">Correo:</label>
            <br>
            <input type="email" id="correo" name="correo" class="email input-accent" required>
            <br>
            <br>
            <label for="password">Contraseña</label>
            <br>
            <input type="password" id="password" name="password" class="password input-accent" required>
            <br>
            <br>
            <button type="submit" class="btn btn-warning">Entrar</button>

        </form>
        <p>¿No estas registrado?</p>
            <a href="{{ url_for('registro') }}" class="btn btn-ghost">registrate</a>

    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


</html>
