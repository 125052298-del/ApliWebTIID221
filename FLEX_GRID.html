<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1_Flex_Grid</title>
    <style>
        .contenedor {
            
        display: flex;
            flex-direction: row;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .card {
            width: 80px;
            padding: 20px;
            margin: 20px;
        }

        .card-larga {
            grid-column: 3;
            grid-row: span 3;
            display: flex;
            flex-direction: column;
            width: auto;
            }

    </style>
</head>
<body>
    <div class="contenedor">
        <div class="card" style="background-color: lightblue;">CARD1</div>
        <div class="card" style="background-color: lightgreen;">CARD2</div>
        <div class="card card-larga" style="background-color: lightyellow;">CARD 3</div>
        <div class="card" style="background-color: lightcoral;">CARD4</div>
        <div class="card" style="background-color: lightgrey;">CARD5</div>
        <div class="card" style="background-color: lightseagreen;">CARD6</div>
        <div class="card" style="background-color: lightcyan;">CARD7</div>
    </div>
</body>
</html>
